[project]
name = "ultra-code"
version = "1.0.0"
description = "ULTRA CODE — Terminal-Based Multi-Agent AI Coding System powered by Google Antigravity"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "google-antigravity",
    "rich>=13.9.0",
    "prompt-toolkit>=3.0.0",
    "click>=8.1.0",
    "textual>=0.74.0",
]

[project.scripts]
ultracode = "ultracode_app.cli:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ultracode_app*"]
